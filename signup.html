<section class="card narrow">

  <p class="sub">이메일과 비밀번호로 간단히 시작해요.</p>
  
  <form method="post" action="signup.html" class="saju-form" data-target="#">
    <label class="full">이메일<input type="email" name="email" value="" placeholder="you@example.com" required></label>
    <label class="full">비밀번호<input type="password" name="password" placeholder="6자 이상" minlength="6" required></label>
    <button type="submit" class="cta">가입하고 시작하기</button>
  </form>
  <p class="authlink">이미 계정이 있으세요? <a href="login.html">로그인</a></p>
</section>

<script>function showLoading(f){location.href=(f&&f.getAttribute("data-target"))||"#";return false;}document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("form").forEach(function(f){f.addEventListener("submit",function(e){e.preventDefault();location.href=f.getAttribute("data-target")||"#";});});});</script></body>
