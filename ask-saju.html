<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요즘 어떤 점이 궁금하세요? · 990원 사주</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html">🐱 착한사주</a>
      <span class="topright">
        
          <a href="index.html">로그아웃</a>
        
      </span>
    </header>

    <main class="wrap">
      
<section class="card"><div style="background:#fff4d6;border:1px solid #ecd9a0;border-radius:10px;padding:9px 12px;margin:10px 0;font-size:12.5px;color:#8a6d3b;text-align:center">🧪 프론트 <b>네비게이션 미리보기</b> · 샘플 데이터 · 해설 본문은 실제 서비스에서 생성</div>
  <div class="ask-head">요즘 어떤 점이 가장 궁금하신가요?</div>
  <p class="ask-who">💜 김성필님의 사주를 보고 있어요</p>
  <div class="ask-tip">✨ 구체적인 상황을 적어주실수록, 사주의 큰 틀 안에서 더 깊이 있고 예리한 분석을 해드려요.</div>

  <form method="post" action="saju.html" id="askForm" onsubmit="return showLoading(this)" data-target="saju.html">
    <input type="hidden" name="profile_id" value="12">
    <div class="fld">
      <div class="fld-top"><span class="qlabel">현재 상황이나 고민</span><span class="opt">(선택)</span></div>
      <textarea name="gomin" id="gomin" maxlength="300" rows="4"
        placeholder="예) 새 사업을 준비 중이에요. 10월에 이사도 가는데 흐름이 궁금해요."></textarea>
      <p class="gomin-hint">🐱 자유롭게 적어보세요 · 개인정보·실명은 적지 마세요</p>
    </div>
    <button type="submit" class="cta">맞춤 해설 보기</button>
    <button type="button" class="skip-link"
      onclick="document.getElementById('gomin').value='';showLoading(document.getElementById('askForm'));">입력 없이 바로 보기</button>
  </form>
  <a class="back-link" href="record-saju.html">← 기록으로</a>
</section>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-msg">사주를 정성껏 풀어보는 중…</div>
</div>
<script>
var MIN_LOADING_MS = 1200;
function showLoading(form) {
  document.getElementById('loadingOverlay').classList.add('show');
  var started = Date.now();
  var fd = new FormData(form);
  var g = document.getElementById('gomin');
  if (g && g.value.trim()) fd.append('gomin', g.value.trim());
  fetch(form.action, { method: 'POST', body: fd })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var wait = Math.max(0, MIN_LOADING_MS - (Date.now() - started));
      setTimeout(function () { document.open(); document.write(html); document.close(); }, wait);
    })
    .catch(function () { form.submit(); });
  return false;
}
</script>

    </main>

    <nav class="tabbar">
      <a href="index.html" class=""><span>🏠</span>홈</a>
      <a href="profile-new.html" class=""><span>➕</span>사주추가</a>
      <a href="pick-daily.html" class="center "><span>🐱</span>무료운세</a>
      <a href="soon.html" class=""><span>💬</span>수다방</a>
      <a href="storage.html" class=""><span>📦</span>보관함</a>
    </nav>
  </div>
<script>function showLoading(f){location.href=(f&&f.getAttribute("data-target"))||"#";return false;}document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("form").forEach(function(f){f.addEventListener("submit",function(e){e.preventDefault();location.href=f.getAttribute("data-target")||"#";});});});</script></body>
</html>
